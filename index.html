<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Rajtvonal Előkvalifikáció</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: white;
  text-align: center;
}

/* Header glow */
.header {
  position: relative;
  padding: 60px 20px 20px;
}

.header::before {
  content: "";
  position: absolute;
  top: -500px;
  left: 50%;
  transform: translateX(-50%);
  width: 1000px;
  height: 1000px;
  background: radial-gradient(circle, rgba(195,0,0,0.25) 0%, transparent 60%);
  filter: blur(80px);
  z-index: 0;
}

h1 {
  position: relative;
  z-index: 1;
  font-weight: bold;
}

.title-red {
  color: #b30000;
}

.title-white {
  color: white;
}

/* Gombok */
.buttons {
  margin-top: 20px;
}

button {
  background: #091b3d; /* sötét kékes-fekete */
  color: white;
  border: none;
  padding: 12px 22px;
  margin: 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button.active {
  background: #b30000; /* piros */
}

/* Tábla */
table {
  margin: 30px auto;
  border-collapse: collapse;
  width: 80%;
  max-width: 900px;
}

th {
  background: #0b1220;
  padding: 10px;
}

td {
  padding: 10px;
}

tr:nth-child(even) {
  background: #101a2a;
}

tr:nth-child(odd) {
  background: #0c1422;
}

/* Színek */
.rank {
  font-weight: bold;
  color: white;
}

.gold { color: gold; }
.silver { color: silver; }
.bronze { color: #cd7f32; }

.name {
  font-weight: bold;
  color: white;
}

.time {
  color: #d0d0d0;
}

.total {
  color: #ffd700;
  font-weight: bold;
}

.delta {
  color: #ff2e2ea6;
  font-size: 12px;
}

/* Footer */
.footer {
  margin-top: 50px;
  font-size: 10px;
  color: #777;
}
</style>
</head>

<body>

<div class="header">
  <h1>
    <span class="title-red">Rajtvonal</span>
    <span class="title-white"> Előkvalifikáció</span>
  </h1>

  <div class="buttons">
    <button onclick="loadData('f1challenge.csv', this)">F1 Challenge (F1 23)</button>
    <button onclick="loadData('simmasters.csv', this)">Sim Masters (LMU)</button>
  </div>
</div>

<table id="leaderboard">
  <thead>
    <tr>
      <th>#</th>
      <th>Név</th>
      <th>Pálya1</th>
      <th>Pálya2</th>
      <th>Pálya3</th>
      <th>Összidő</th>
    </tr>
  </thead>
  <tbody>
    <!-- Üres kezdetben -->
  </tbody>
</table>

<div class="footer">
  Utolsó módosítás: 2026. 04. 25 | 21:40
</div>

<script>
function parseTime(t) {
  let [min, sec] = t.split(":");
  return parseFloat(min) * 60 + parseFloat(sec);
}

function formatTime(s) {
  let min = Math.floor(s / 60);
  let sec = (s % 60).toFixed(3).padStart(6, '0');
  return `${min}:${sec}`;
}

function loadData(file, btn) {
  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  fetch(file)
    .then(res => res.text())
    .then(text => {
      let rows = text.trim().split("\n").map(r => r.split(","));

      let data = rows.map(r => {
        let t1 = parseTime(r[1]);
        let t2 = parseTime(r[2]);
        let t3 = parseTime(r[3]);
        return {
          name: r[0],
          t1, t2, t3,
          total: t1 + t2 + t3
        };
      });

      data.sort((a,b) => a.total - b.total);

      let best = data[0]?.total || 0;

      let tbody = document.querySelector("#leaderboard tbody");
      tbody.innerHTML = "";

      data.forEach((d, i) => {
        let rankClass = i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
        let delta = d.total - best;

        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="rank ${rankClass}">${i+1}</td>
          <td class="name">${d.name}</td>
          <td class="time">${formatTime(d.t1)}</td>
          <td class="time">${formatTime(d.t2)}</td>
          <td class="time">${formatTime(d.t3)}</td>
          <td class="total">
            ${formatTime(d.total)}
            ${i !== 0 ? `<div class="delta">(+${delta.toFixed(3)}s)</div>` : ""}
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
}
</script>

</body>
</html>
